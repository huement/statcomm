title: 'Blog Comments'
honeypot: honeypot_field
blueprint:
    sections:
        main:
            fields:
                - handle: name
                  field:
                      type: text
                      display: 'Name'
                      validate: 'required|min:2|max:50'
                - handle: email
                  field:
                      type: text
                      input_type: email
                      display: 'Email Address'
                      validate: 'required|email'
                - handle: comment
                  field:
                      type: textarea
                      display: 'Comment'
                      validate: 'required|min:10|max:2000'
                - handle: article_id
                  field:
                      type: text
                      display: 'Article ID'
                      visibility: hidden
                      validate: 'required'
                - handle: parent_id
                  field:
                      type: text
                      display: 'Parent Comment ID'
                      visibility: hidden
                - handle: approved
                  field:
                      type: toggle
                      display: 'Approved Status'
                      default: false
                      visibility: visible
